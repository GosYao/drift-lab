# Pull-request checks for Drift Lab.
#
# Deterministic gates come first and their verdicts are authoritative:
#   - make check           unit tests + repo contracts
#   - make terraform-check fmt/validate (no backend, no credentials)
#   - make policy-test     capability-intent Terraform tests (mock providers)
#   - semgrep              OWASP Top 10 (pinned image digest)
#   - trivy                vuln + secret scan (pinned image digest)
#   - verify-fix           for fix/ branches: the fix-evidence gates
#
# The scanners run through scripts/scanners.py, the same pinned definition
# used locally, and upload their normalized findings even when they fail so
# the review job can read them.
#
# The Droid review is a separate explanation layer with separated credentials:
# the credentialed job (FACTORY_API_KEY, read-only checkout, no GitHub token)
# runs scripts/triage.py, which computes the evidence (gates, scanners,
# chained exposure, diff), hands it read-only to the triage model named in
# .factory/droids/triage.md, and uploads the review packets as an artifact; a
# second job holding only GITHUB_TOKEN (pull-requests: write) posts it. The
# model recommends; it cannot change a check result, and if it fails or
# returns an unusable answer the review says so instead of guessing.
#
# Deliberately absent: any terraform plan/apply against AWS (the approved
# deployment revision only, per AGENTS.md), and any scheduled drift check
# (hosted runners cannot reach the lab's private EKS API).
name: pull-request

on:
  # Every pull request, whatever branch it targets: the fix for a finding
  # that lives on an unmerged branch is a pull request into that branch.
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege by default; each job elevates only what it needs.
permissions: {}

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - run: make check

  terraform:
    name: terraform-check + policy-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - run: make terraform-check
      - run: make policy-test

  semgrep:
    name: semgrep (owasp-top-ten)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Semgrep scan
        run: python3 scripts/scanners.py semgrep --out-dir findings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-findings
          path: findings/semgrep.json
          if-no-files-found: error

  trivy:
    name: trivy (vuln, secret)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Trivy filesystem scan
        run: python3 scripts/scanners.py trivy --out-dir findings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-findings
          path: findings/trivy.json
          if-no-files-found: error

  verify-fix:
    name: verify-fix (fix/ branches)
    # Only a branch named fix/* claims to fix a finding; only those get the
    # fix-evidence gates. The judge (the verifier and the scanner definition)
    # is taken from the default branch, so neither the fix nor the branch it
    # targets can change the checks that judge it. The fix is compared with
    # the pull request's base: the code that has the finding.
    if: startsWith(github.event.pull_request.head.ref, 'fix/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: Verify the fix
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Public repository: reading the default branch needs no credentials.
          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git archive "origin/$DEFAULT_BRANCH" \
            scripts/verify_fix.py scripts/scanners.py | tar -x -C /tmp
          python3 /tmp/scripts/verify_fix.py --root "$PWD" --base "$BASE_SHA" \
            --scan-base --report "$RUNNER_TEMP/fix-evidence.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fix-evidence
          path: ${{ runner.temp }}/fix-evidence.md
          if-no-files-found: error

  droid-gate:
    name: droid availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          # Boolean only; the secret value never enters the log.
          HAS_KEY: ${{ secrets.FACTORY_API_KEY != '' }}
        run: echo "configured=$HAS_KEY" >> "$GITHUB_OUTPUT"

  droid-review:
    name: droid review (read-only)
    needs: [droid-gate, tests, terraform, semgrep, trivy, verify-fix]
    # Runs even when a gate failed: the failed gate is exactly what the review
    # explains. It still only runs when the Factory key is configured.
    if: always() && needs.droid-gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # The only credential this job receives. It holds no GitHub write
      # token, so the review run cannot post, approve, or modify anything.
      FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: Fetch branch refs for chained-exposure evidence
        # The checkout holds only this pull request's ref; chained exposure
        # also reads the other branches. Public repository: no credentials.
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-findings"
          path: evidence
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: fix-evidence
          path: evidence
      - name: Install Droid CLI
        # Accepted risk (triage record in docs/WORKLOG.md, 0.7.1): the
        # vendor-documented install path, over TLS from the vendor's own
        # domain, in an ephemeral job that holds only the FACTORY_API_KEY the
        # same vendor issued. Download-then-exec would hide this trust from
        # the scanner without changing it.
        run: | # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
          curl -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/droid" --version
      - name: Build the review packets
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/triage.py --base "$BASE_SHA" --evidence evidence \
            --out "$RUNNER_TEMP/review.md"
          test -s "$RUNNER_TEMP/review.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: droid-review
          path: ${{ runner.temp }}/review.md
          if-no-files-found: error

  post-review:
    name: post droid review
    needs: droid-review
    # A failed gate upstream of the review would otherwise skip this job, and
    # the packet that explains the failure would never be posted.
    if: always() && needs.droid-review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: droid-review
      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr comment "$PR_URL" --body-file review.md
